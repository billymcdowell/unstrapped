[workspace]
resolver = "3"
members = ["src-tauri", "crates/unstrapped-core", "crates/unstrapped-emulator"]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "MIT"
authors = ["Billy McDowell"]
repository = "https://github.com/billymcdowell/unstrapped"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
hex = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
