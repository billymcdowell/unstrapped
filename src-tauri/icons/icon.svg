<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Unstrapped app icon. Source for `npx tauri icon src-tauri/icons/icon.svg`.
       An unclasped strap (open ring) in the app's recovery / strain / sleep colours,
       with one bead slipping out of the gap. Follows the macOS icon grid: 824 px tile, 100 px margin. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232838"/>
      <stop offset="1" stop-color="#0c0e15"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="band" gradientUnits="userSpaceOnUse" x1="330" y1="790" x2="660" y2="250">
      <stop offset="0" stop-color="#3fd884"/>
      <stop offset="0.5" stop-color="#4cb0ff"/>
      <stop offset="1" stop-color="#9a8cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.5">
      <stop offset="0" stop-color="#4cb0ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4cb0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- tile, with the drop shadow macOS icons carry -->
  <rect x="100" y="112" width="824" height="824" rx="185" fill="#000000" opacity="0.35" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <circle cx="512" cy="540" r="330" fill="url(#glow)"/>

  <!-- soft glow under the band -->
  <path d="M 728.1 461.3 A 230 230 0 1 1 551.9 313.5" fill="none" stroke="url(#band)" stroke-width="92"
        stroke-linecap="round" opacity="0.45" filter="url(#soft)"/>
  <!-- the open band: 300 degrees, gap at the upper right -->
  <path d="M 728.1 461.3 A 230 230 0 1 1 551.9 313.5" fill="none" stroke="url(#band)" stroke-width="92"
        stroke-linecap="round"/>
  <!-- the freed bead -->
  <circle cx="738" cy="270" r="46" fill="#9a8cff" opacity="0.45" filter="url(#soft)"/>
  <circle cx="738" cy="270" r="46" fill="#9a8cff"/>
</svg>
