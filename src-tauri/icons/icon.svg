<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Unstrapped app icon. Source for `npx tauri icon src-tauri/icons/icon.svg`.
       Matches the app's tile style: a grainy mesh gradient blending the Sleep (dusk), Strain (ochre)
       and Recovery (sage) tiles, faint white guide rings, and an unclasped strap (open ink ring)
       with the lime bead slipping out of the gap. Follows the macOS icon grid: 824 px tile, 100 px margin. -->
  <defs>
    <clipPath id="tile-clip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <linearGradient id="base" x1="0.85" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#e6a074"/>
      <stop offset="0.35" stop-color="#dfac8c"/>
      <stop offset="0.7" stop-color="#cdb2a5"/>
      <stop offset="1" stop-color="#a8b5c2"/>
    </linearGradient>
    <radialGradient id="ochre" cx="0.3" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#eab35a"/>
      <stop offset="1" stop-color="#eab35a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sage" cx="0.15" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#a3c486"/>
      <stop offset="1" stop-color="#a3c486" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="slate" cx="0.95" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#9fb1c2"/>
      <stop offset="1" stop-color="#9fb1c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.9 0"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- tile, with the drop shadow macOS icons carry -->
  <rect x="100" y="112" width="824" height="824" rx="185" fill="#000000" opacity="0.28" filter="url(#shadow)"/>
  <g clip-path="url(#tile-clip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#base)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#ochre)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sage)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#slate)" opacity="0.8"/>
    <rect x="100" y="100" width="824" height="824" filter="url(#grain)" opacity="0.16"/>
  </g>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- faint white guide rings (line art) -->
  <g fill="none" stroke="#ffffff" stroke-width="4" opacity="0.6">
    <circle cx="512" cy="530" r="172"/>
    <circle cx="512" cy="530" r="134"/>
    <circle cx="512" cy="530" r="96"/>
    <circle cx="512" cy="530" r="58"/>
  </g>

  <!-- the open band: 300 degrees in ink, gap at the upper right -->
  <path d="M 726.25 452.02 A 228 228 0 1 1 551.59 305.46" fill="none" stroke="#000000" stroke-opacity="0.18"
        stroke-width="64" stroke-linecap="round" filter="url(#soft)" transform="translate(0 10)"/>
  <path d="M 726.25 452.02 A 228 228 0 1 1 551.59 305.46" fill="none" stroke="#1b1b19"
        stroke-width="64" stroke-linecap="round"/>

  <!-- the freed bead: lime with a soft glow and a thin ink outline -->
  <circle cx="724" cy="277" r="100" fill="url(#halo)"/>
  <circle cx="724" cy="277" r="46" fill="#cdec2b" stroke="#1b1b19" stroke-width="5"/>
</svg>
