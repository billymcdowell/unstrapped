[package]
name = "unstrapped"
version.workspace = true
description = "Unstrapped: a local-first Mac app that syncs a WHOOP 4.0 / 5.0 strap over Bluetooth."
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "unstrapped_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
unstrapped-core = { path = "../crates/unstrapped-core" }
unstrapped-emulator = { path = "../crates/unstrapped-emulator" }
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-liquid-glass = "0.1.6"
btleplug = "0.13.5"
futures = "0.3.34"
async-trait = "0.1.92"
rusqlite = { version = "0.43.0", features = ["bundled"] }
uuid = { workspace = true, features = ["v4"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tokio = { workspace = true, features = ["full"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.8.1"
hex.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"

[dev-dependencies]
tempfile = "3.27.0"


